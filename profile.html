            </div>
            <div class="content">
                <span class="body-4 text-dark-4">Welcome back!</span>
                <h4 class="name">Hello, Tech Corp <img class="icon" src="../images/icon/hello.png" alt=""></h4>
            </div>
        </a>
        <div class="right">

            </a>
            <a class="box-icon" href="#menu">
                <svg width="22" height="22" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.5 10H17.5" stroke="#111827" stroke-width="1.5" stroke-linecap="round" />
                    <path d="M2.5 5H17.5" stroke="#111827" stroke-width="1.5" stroke-linecap="round" />
                    <path d="M2.5 15H17.5" stroke="#111827" stroke-width="1.5" stroke-linecap="round" />
                </svg>
            </a>
        </div>
    </div>

    <div class="app-content style-2">
        <div class="tf-container">
            <div class="form-card">
                <h4>Post a Task</h4>
                <p class="body-4 text-dark-4">Create a new task and share it with top candidates.</p>
                <form id="post-task-form" class="task-form">
                    <label class="input-label">Task Title</label>
                    <input type="text" id="task-title" class="input-field" placeholder="Enter task title" required>

                    <label class="input-label">Task Description</label>
                    <textarea id="task-description" class="textarea-field" rows="4" placeholder="Describe the task" required></textarea>

                    <label class="input-label">Required Skills</label>
                    <input type="text" id="task-skills" class="input-field" placeholder="e.g. React, UX, Product" required>

                    <label class="input-label">Deadline</label>
                    <input type="date" id="task-deadline" class="input-field" required>

                    <label class="input-label">Task Requirements</label>
                    <textarea id="task-requirements" class="textarea-field" rows="3" placeholder="List requirements or upload details"></textarea>

                    <label class="input-label">Attachment</label>
                    <input type="file" id="task-file" class="input-field file-input">

                    <button type="submit" class="btn-primary">Post Task</button>
                    <p id="task-feedback" class="success-message"></p>
                </form>
            </div>
        </div>
    </div>

        <ul class="inner-bar">
            <li>
                <a href="dashboard.html">

                    </svg>

            </li>

            <li class="action-add">

                        <path d="M6 12H18" stroke="white" stroke-width="1.5" stroke-linecap="round" />
                        <path d="M12 18V6" stroke="white" stroke-width="1.5" stroke-linecap="round" />
                    </svg>
                </a>
            </li>
            <li>
                <a href="messages.html">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8.5 19H8C4 19 2 18 2 13V8C2 4 4 2 8 2H16C20 2 22 4 22 8V13C22 17 20 19 16 19H15.5C15.19 19 14.89 19.15 14.7 19.4L13.2 21.4C12.54 22.28 11.46 22.28 10.8 21.4L9.3 19.4C9.14 19.18 8.77 19 8.5 19Z" stroke="#111827" stroke-width="1.5" />

                        <path d="M7.99451 11H8.00349" stroke="#111827" stroke-width="2" stroke-linecap="round" />
